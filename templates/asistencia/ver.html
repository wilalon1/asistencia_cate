{% extends 'base/base.html' %}

{% block content %}

<h2>
    Consulta de Asistencia
</h2>

<div class="card">

```
<h3>
    📋 Detalle de Asistencia
</h3>

<div class="filtros">

    <input
        type="text"
        id="codigo"
        placeholder="Código de persona"
    >

    <input
        type="date"
        id="fecha_inicio"
    >

    <input
        type="date"
        id="fecha_fin"
    >

    <button onclick="consultar()">
        Consultar
    </button>

</div>

<div id="persona"></div>

<div id="reporteAsistencia"></div>
```

</div>

<style>

.card{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 15px #ddd;
    overflow-x:auto;
}

.filtros{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.filtros input,
.filtros button{
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

.filtros input{
    flex:1 1 200px;
}

.filtros button{
    background:#34495e;
    color:white;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#34495e;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#eef8ff;
}

.reporteAsistencia{
    width:100%;
}


.seccion-mes{

    margin-top:30px;

    padding:20px;

    border:1px solid #ddd;

    border-radius:10px;

    background:#fff;

}


.mes-header{

    text-align:center;

    margin-bottom:20px;

}


.mes-header h2{

    margin:0;

    text-transform:capitalize;

    color:#34495e;

}


.mes-header h3{

    margin-top:8px;

    color:#555;

}


.tablas-mes{

    display:flex;

    gap:20px;

    align-items:flex-start;

}


.tabla-contenedor{

    width:50%;

}


.tabla-contenedor h3{

    text-align:center;

    padding:10px;

    margin:0;

}


.titulo-catequesis{

    background:#34495e;

    color:white;

}


.titulo-misas{

    background:#34495e;

    color:white;

}


.tabla-reporte{

    width:100%;

    border-collapse:collapse;

}


.tabla-reporte th{

    background:#eee;

    color:#333;

    padding:10px;

    border:1px solid #ddd;

}


.tabla-reporte td{

    padding:10px;

    border:1px solid #ddd;

    text-align:center;

}


.tabla-reporte tr:hover{

    background:#eef8ff;

}


.leyenda{

    margin-top:10px;

    padding:8px;

    font-size:13px;

    background:#f5f5f5;

    border-radius:5px;

}


.sin-registros{

    padding:20px;

    text-align:center;

}


@media(max-width:800px){

    .tablas-mes{

        flex-direction:column;

    }

    .tabla-contenedor{

        width:100%;

    }

}
</style>

<script>

function consultar(){

    let codigo =
        document.getElementById("codigo").value;

    let inicio =
        document.getElementById("fecha_inicio").value;

    let fin =
        document.getElementById("fecha_fin").value;


    if(!codigo){

        alert("Ingrese el código de la persona");

        return;
    }


    let url =
        `/api/asistencia-detalle/?codigo=${codigo}`;


    if(inicio){

        url +=
            `&fecha_inicio=${convertir(inicio)}`;

    }


    if(fin){

        url +=
            `&fecha_fin=${convertir(fin)}`;

    }


    fetch(url)

        .then(response => {

            if(!response.ok){

                throw new Error(
                    "Error al consultar la API"
                );

            }

            return response.json();

        })

        .then(data => {

            pintarTabla(data);

        })

        .catch(error => {

            console.error(error);

            alert(
                "Ocurrió un error al consultar la asistencia"
            );

        });

}


function convertir(fecha){

    if(!fecha)
        return "";

    let partes =
        fecha.split("-");

    return `${partes[2]}-${partes[1]}-${partes[0]}`;

}


function pintarTabla(data){

    let contenedor =
        document.getElementById("reporteAsistencia");

    contenedor.innerHTML = "";


    if(data.length === 0){

        contenedor.innerHTML = `
            <div class="sin-registros">
                No se encontraron registros
            </div>
        `;

        return;
    }


    // ==========================================
    // OBTENER RANGO DE FECHAS SELECCIONADO
    // ==========================================

    let inicioInput =
        document.getElementById("fecha_inicio").value;

    let finInput =
        document.getElementById("fecha_fin").value;


    if(!inicioInput || !finInput){

        alert("Ingrese la fecha de inicio y fecha fin");

        return;
    }


    let inicio =
        new Date(inicioInput + "T00:00:00");

    let fin =
        new Date(finInput + "T00:00:00");



    // ==========================================
    // OBTENER TODOS LOS MESES DEL RANGO
    // ==========================================

    let meses = [];


    let fechaActual = new Date(
        inicio.getFullYear(),
        inicio.getMonth(),
        1
    );


    while(
        fechaActual <= fin
    ){

        meses.push({

            año:
                fechaActual.getFullYear(),

            mes:
                fechaActual.getMonth(),

            nombre:
                fechaActual.toLocaleDateString(
                    'es-ES',
                    {
                        month:'long',
                        year:'numeric'
                    }
                )

        });


        fechaActual.setMonth(
            fechaActual.getMonth() + 1
        );

    }



    // ==========================================
    // ORDENAR LOS REGISTROS POR FECHA
    // ==========================================

    data.sort(function(a,b){

        return new Date(a.fecha) -
               new Date(b.fecha);

    });



    // ==========================================
    // NOMBRE DE LA PERSONA
    // ==========================================

    let nombrePersona =
        data[0].persona_nombre || "";



    // ==========================================
    // CREAR CADA MES
    // ==========================================

    meses.forEach(function(mesInfo){


        let mesDiv =
            document.createElement("div");

        mesDiv.className =
            "seccion-mes";



        // ======================================
        // REGISTROS DEL MES
        // ======================================

        let registrosMes =
            data.filter(function(item){

                let fecha =
                    new Date(
                        item.fecha + "T00:00:00"
                    );

                return (
                    fecha.getFullYear()
                    === mesInfo.año
                    &&
                    fecha.getMonth()
                    === mesInfo.mes
                );

            });



        // ======================================
        // CATEQUESIS
        // ======================================

        let catequesis =
            registrosMes.filter(function(item){

                return (
                    item.catequesis === true
                    &&
                    item.misa === false
                );

            });



        // ======================================
        // MISAS
        // ======================================

        let misas =
            registrosMes.filter(function(item){

                return item.misa === true;

            });



        // ======================================
        // ORDENAR CATEQUESIS
        // ======================================

        catequesis.sort(function(a,b){

            return new Date(a.fecha) -
                   new Date(b.fecha);

        });



        // ======================================
        // ORDENAR MISAS
        // ======================================

        misas.sort(function(a,b){

            return new Date(a.fecha) -
                   new Date(b.fecha);

        });



        // ======================================
        // HTML DEL MES
        // ======================================

        let html = `

            <div class="mes-header">

                <h2>
                    ${capitalizar(
                        mesInfo.nombre
                    )}
                </h2>

                <h3>
                    ${nombrePersona}
                </h3>

            </div>


            <div class="tablas-mes">


                <!-- ========================= -->
                <!-- CATEQUESIS                 -->
                <!-- ========================= -->

                <div class="tabla-contenedor">

                    <h3 class="titulo-catequesis">
                        Catequesis
                    </h3>


                    <table class="tabla-reporte">

                        <thead>

                            <tr>

                                <th>
                                    Fecha
                                </th>

                                <th>
                                    Estado
                                </th>

                                <th>
                                    Observación
                                </th>

                            </tr>

                        </thead>


                        <tbody>
        `;



        if(catequesis.length === 0){

            html += `

                <tr>

                    <td colspan="3">
                        No hay registros
                    </td>

                </tr>

            `;

        }
        else{

            catequesis.forEach(function(item){


                let estado =
                    item.justificado
                    ? "J"
                    : "A";


                html += `

                    <tr>

                        <td>
                            ${formatearFecha(
                                item.fecha
                            )}
                        </td>

                        <td>
                            ${estado}
                        </td>

                        <td>
                            ${item.observacion || "-"}
                        </td>

                    </tr>

                `;

            });

        }



        html += `

                        </tbody>

                    </table>


                    <div class="leyenda">

                        <strong>Leyenda:</strong>

                        A = Asistió

                        &nbsp;&nbsp;|&nbsp;&nbsp;

                        J = Justificado

                    </div>

                </div>



                <!-- ========================= -->
                <!-- MISAS                      -->
                <!-- ========================= -->

                <div class="tabla-contenedor">

                    <h3 class="titulo-misas">
                        Misas
                    </h3>


                    <table class="tabla-reporte">

                        <thead>

                            <tr>

                                <th>
                                    Fecha
                                </th>

                                <th>
                                    Estado
                                </th>

                            </tr>

                        </thead>


                        <tbody>
        `;



        if(misas.length === 0){

            html += `

                <tr>

                    <td colspan="2">
                        No hay registros
                    </td>

                </tr>

            `;

        }
        else{

            misas.forEach(function(item){

                html += `

                    <tr>

                        <td>
                            ${formatearFecha(
                                item.fecha
                            )}
                        </td>

                        <td>
                            A
                        </td>

                    </tr>

                `;

            });

        }



        html += `

                        </tbody>

                    </table>


                    <div class="leyenda">

                        <strong>Leyenda:</strong>

                        A = Asistió a Misa

                    </div>

                </div>


            </div>

        `;



        mesDiv.innerHTML = html;


        contenedor.appendChild(
            mesDiv
        );

    });

}

function capitalizar(texto){

    if(!texto)
        return "";

    return texto.charAt(0).toUpperCase()
        + texto.slice(1);

}


function formatearFecha(fecha){

    if(!fecha)
        return "-";

    let partes =
        fecha.split("-");

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

</script>

{% endblock %}
